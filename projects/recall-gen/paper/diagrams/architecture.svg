<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700"
     font-family="Libertinus Serif, serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/>
    </marker>
    <marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/>
    </marker>
    <marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/>
    </marker>
  </defs>

  <!-- ══════════════ panel (a): the episode and the bottleneck ══════════════ -->
  <text x="24" y="30" font-size="19" font-weight="bold" fill="#0b0b0b">
    (a) an episode — the state is the only path from context to query
  </text>

  <!-- context tokens -->
  <g>
    <rect x="40"  y="86" width="54" height="54" rx="3" fill="#f2f1ee" stroke="#2a78d6" stroke-width="2"/>
    <path d="M 54 100 q 14 -6 24 4 q -18 12 -8 26" fill="none" stroke="#3a3936" stroke-width="3.4" stroke-linecap="round"/>
    <rect x="104" y="86" width="54" height="54" rx="3" fill="#f2f1ee" stroke="#2a78d6" stroke-width="2"/>
    <path d="M 118 100 h 24 l -14 30" fill="none" stroke="#3a3936" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="168" y="86" width="54" height="54" rx="3" fill="#f2f1ee" stroke="#2a78d6" stroke-width="2"/>
    <path d="M 195 98 v 32 M 186 106 l 9 -8" fill="none" stroke="#3a3936" stroke-width="3.4" stroke-linecap="round"/>
    <text x="243" y="122" font-size="20" fill="#52514e">···</text>
    <rect x="258" y="86" width="54" height="54" rx="3" fill="#f2f1ee" stroke="#2a78d6" stroke-width="2"/>
    <path d="M 272 128 q 12 -34 26 -2 M 278 116 h 14" fill="none" stroke="#3a3936" stroke-width="3.4" stroke-linecap="round"/>
  </g>
  <text x="176" y="166" font-size="15.5" fill="#0b0b0b" text-anchor="middle">
    M context images, complete
  </text>
  <text x="176" y="186" font-size="15" fill="#2a78d6" text-anchor="middle">
    these WRITE to the state
  </text>

  <!-- the state -->
  <rect x="392" y="66" width="196" height="96" rx="9" fill="#ffffff" stroke="#3a3936" stroke-width="2.4"/>
  <text x="490" y="98" font-size="21" font-weight="bold" fill="#0b0b0b" text-anchor="middle">state S</text>
  <text x="490" y="121" font-size="14.5" fill="#52514e" text-anchor="middle">H × d<tspan font-size="11.5" dy="3">k</tspan><tspan dy="-3"> × d</tspan><tspan font-size="11.5" dy="3">k</tspan></text>
  <text x="490" y="143" font-size="15" fill="#0b0b0b" text-anchor="middle">= 16 384 numbers</text>
  <text x="470" y="212" font-size="15" fill="#52514e" text-anchor="middle">
    fixed — it does not grow with M
  </text>

  <!-- query tokens -->
  <g>
    <rect x="700" y="86" width="54" height="54" rx="3" fill="#f2f1ee" stroke="#eb6834" stroke-width="2"/>
    <path d="M 714 100 q 14 -6 24 4" fill="none" stroke="#3a3936" stroke-width="3.4" stroke-linecap="round"/>
    <rect x="700" y="113" width="54" height="27" fill="#b9b7b1" stroke="#eb6834" stroke-width="2"/>
    <rect x="764" y="86" width="54" height="54" rx="3" fill="#f2f1ee" stroke="#eb6834" stroke-width="2"/>
    <path d="M 778 100 h 24" fill="none" stroke="#3a3936" stroke-width="3.4" stroke-linecap="round"/>
    <rect x="764" y="113" width="54" height="27" fill="#b9b7b1" stroke="#eb6834" stroke-width="2"/>
    <text x="836" y="122" font-size="20" fill="#52514e">···</text>
  </g>
  <text x="775" y="166" font-size="15.5" fill="#0b0b0b" text-anchor="middle">
    Q queries, bottom half hidden
  </text>
  <text x="775" y="186" font-size="15" fill="#eb6834" text-anchor="middle">
    these only READ
  </text>

  <!-- write arrow -->
  <path d="M 320 113 C 350 113, 358 113, 386 113" fill="none" stroke="#2a78d6" stroke-width="2.4"
        marker-end="url(#ah)"/>
  <text x="353" y="100" font-size="14.5" fill="#2a78d6" text-anchor="middle">write</text>
  <text x="353" y="140" font-size="13.5" fill="#52514e" text-anchor="middle">β &gt; 0</text>

  <!-- read arrow -->
  <path d="M 594 113 C 630 113, 660 113, 694 113" fill="none" stroke="#eb6834" stroke-width="2.4"
        marker-end="url(#ah-o)"/>
  <text x="644" y="100" font-size="14.5" fill="#eb6834" text-anchor="middle">read</text>
  <text x="644" y="140" font-size="13.5" fill="#52514e" text-anchor="middle">o = S q</text>

  <!-- queries never write -->
  <path d="M 714 150 C 700 206, 620 210, 594 158" fill="none" stroke="#9c9a94" stroke-width="2"
        stroke-dasharray="6 5" marker-end="url(#ah-k)"/>
  <g stroke="#c1121f" stroke-width="3.2" stroke-linecap="round">
    <path d="M 645 190 l 17 17"/><path d="M 662 190 l -17 17"/>
  </g>
  <text x="653" y="235" font-size="15" fill="#c1121f" text-anchor="middle">
    β = 0 — a query never writes
  </text>

  <!-- ══════════════ panel (b): the stack ══════════════ -->
  <line x1="24" y1="272" x2="956" y2="272" stroke="#d8d6d1" stroke-width="1.2"/>
  <text x="24" y="306" font-size="19" font-weight="bold" fill="#0b0b0b">
    (b) what each token passes through
  </text>

  <g font-size="14.5" fill="#0b0b0b" text-anchor="middle">
    <rect x="40"  y="336" width="96" height="46" rx="5" fill="#f2f1ee" stroke="#7d7b76" stroke-width="1.8"/>
    <text x="88" y="358">embed</text>
    <text x="88" y="374" font-size="13" fill="#52514e">784 → 256</text>

    <rect x="176" y="336" width="86" height="46" rx="5" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="219" y="364">layer 1</text>
    <rect x="282" y="336" width="86" height="46" rx="5" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="325" y="364">layer 2</text>
    <rect x="388" y="336" width="86" height="46" rx="5" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="431" y="364">layer 3</text>
    <rect x="494" y="336" width="86" height="46" rx="5" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="537" y="364">layer 4</text>

    <rect x="620" y="336" width="96" height="46" rx="5" fill="#f2f1ee" stroke="#7d7b76" stroke-width="1.8"/>
    <text x="668" y="358">head</text>
    <text x="668" y="374" font-size="13" fill="#52514e">256 → 784</text>
  </g>
  <g stroke="#52514e" stroke-width="1.8" fill="none" marker-end="url(#ah-k)">
    <path d="M 138 359 h 34"/><path d="M 264 359 h 14"/><path d="M 370 359 h 14"/>
    <path d="M 476 359 h 14"/><path d="M 582 359 h 34"/><path d="M 718 359 h 30"/>
  </g>

  <!-- output -->
  <rect x="752" y="330" width="58" height="58" rx="3" fill="#f2f1ee" stroke="#7d7b76" stroke-width="1.8"/>
  <path d="M 767 345 q 14 -6 24 4" fill="none" stroke="#3a3936" stroke-width="3.4" stroke-linecap="round"/>
  <rect x="752" y="359" width="58" height="29" fill="#cfe0f6" stroke="#2a78d6" stroke-width="1.8"/>
  <text x="826" y="356" font-size="14.5" fill="#0b0b0b">only the shaded</text>
  <text x="826" y="374" font-size="14.5" fill="#0b0b0b">half is scored</text>

  <!-- expansion of one layer -->
  <path d="M 325 386 L 250 436" fill="none" stroke="#9c9a94" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M 325 386 L 800 436" fill="none" stroke="#9c9a94" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="40" y="436" width="900" height="232" rx="9" fill="#fbfbfa" stroke="#c9c7c2" stroke-width="1.6"/>
  <text x="62" y="466" font-size="15.5" font-style="italic" fill="#52514e">inside one layer</text>

  <g font-size="14.5" fill="#0b0b0b" text-anchor="middle">
    <text x="86" y="546" font-size="16">h</text>
    <rect x="116" y="522" width="84" height="44" rx="5" fill="#ffffff" stroke="#7d7b76" stroke-width="1.6"/>
    <text x="158" y="549">LayerNorm</text>

    <rect x="232" y="506" width="150" height="76" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="2"/>
    <text x="307" y="534" font-weight="bold">KDA</text>
    <text x="307" y="554" font-size="13.5" fill="#52514e">writes S, then</text>
    <text x="307" y="570" font-size="13.5" fill="#52514e">reads the finished S</text>

    <circle cx="428" cy="544" r="17" fill="#ffffff" stroke="#7d7b76" stroke-width="1.6"/>
    <text x="428" y="550" font-size="17">+</text>

    <rect x="482" y="522" width="84" height="44" rx="5" fill="#ffffff" stroke="#7d7b76" stroke-width="1.6"/>
    <text x="524" y="549">LayerNorm</text>

    <rect x="598" y="514" width="112" height="60" rx="6" fill="#f2f1ee" stroke="#7d7b76" stroke-width="1.8"/>
    <text x="654" y="540">MLP</text>
    <text x="654" y="560" font-size="13" fill="#52514e">256 → 1024 → 256</text>

    <circle cx="762" cy="544" r="17" fill="#ffffff" stroke="#7d7b76" stroke-width="1.6"/>
    <text x="762" y="550" font-size="17">+</text>
    <text x="822" y="550" font-size="16">h′</text>
  </g>
  <g stroke="#52514e" stroke-width="1.8" fill="none" marker-end="url(#ah-k)">
    <path d="M 96 544 h 14"/><path d="M 202 544 h 24"/><path d="M 384 544 h 24"/>
    <path d="M 447 544 h 29"/><path d="M 568 544 h 24"/><path d="M 712 544 h 30"/>
    <path d="M 781 544 h 28"/>
  </g>
  <!-- residual arcs -->
  <g stroke="#9c9a94" stroke-width="1.6" fill="none" marker-end="url(#ah-k)" stroke-dasharray="5 4">
    <path d="M 106 530 C 106 486, 428 486, 428 524"/>
    <path d="M 462 530 C 462 486, 762 486, 762 524"/>
  </g>
  <text x="267" y="480" font-size="13.5" fill="#52514e" text-anchor="middle">residual</text>
  <text x="612" y="480" font-size="13.5" fill="#52514e" text-anchor="middle">residual</text>

  <text x="62" y="640" font-size="14.5" fill="#52514e">
    The same S is written and read once per layer; there are four of them, and none is shared.
  </text>
  <text x="62" y="660" font-size="14.5" fill="#52514e">
    Context tokens write in every layer; query tokens write in none.
  </text>
</svg>
