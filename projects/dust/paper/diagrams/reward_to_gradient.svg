<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937"><rect width="900" height="460" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="450" y="26" text-anchor="middle" font-size="18" fill="#7c3aed" font-weight="bold" font-style="normal">DUST on one linear layer  y = W x</text><rect x="30" y="92" width="120" height="54" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="90" y="116" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="bold" font-style="normal">input xₜ</text><text x="90" y="135" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="normal" font-style="normal">cached, clean pass</text><line x1="150" y1="119" x2="200" y2="119" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><rect x="200" y="92" width="90" height="54" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="245" y="126" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="bold" font-style="normal">W</text><line x1="290" y1="119" x2="340" y2="119" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><circle cx="360" cy="119" r="20" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="360" y="126" text-anchor="middle" font-size="22" fill="#7c3aed" font-weight="bold" font-style="normal">+</text><text x="360" y="62" text-anchor="middle" font-size="15" fill="#7c3aed" font-weight="bold" font-style="normal">σ aₜ</text><text x="360" y="78" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="normal" font-style="normal">fresh N(0, I) at every token</text><line x1="360" y1="84" x2="360" y2="97" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/><line x1="380" y1="119" x2="430" y2="119" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><rect x="430" y="92" width="170" height="54" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="515" y="116" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="normal" font-style="normal">rest of the network</text><text x="515" y="135" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="normal" font-style="normal">rerun from this block</text><line x1="600" y1="119" x2="650" y2="119" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><rect x="650" y="92" width="130" height="54" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="715" y="116" text-anchor="middle" font-size="15" fill="#7c3aed" font-weight="bold" font-style="normal">loss ℓₜ</text><text x="715" y="135" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="normal" font-style="normal">that token's own</text><text x="796" y="112" text-anchor="start" font-size="14" fill="#6b7280" font-weight="normal" font-style="italic">× K draws</text><text x="796" y="130" text-anchor="start" font-size="12" fill="#6b7280" font-weight="normal" font-style="italic">n at a time</text><rect x="30" y="200" width="270" height="150" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/><text x="165" y="228" text-anchor="middle" font-size="15" fill="#7c3aed" font-weight="bold" font-style="normal">1  reward</text><text x="165" y="268" text-anchor="middle" font-size="18" fill="#1f2937" font-weight="bold" font-style="normal">rₜ = mean(ℓₜ) − ℓₜ</text><text x="165" y="304" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="normal" font-style="normal">positive when this draw's noise</text><text x="165" y="322" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="normal" font-style="normal">lowered token t's loss</text><rect x="320" y="200" width="270" height="150" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/><text x="455" y="228" text-anchor="middle" font-size="15" fill="#7c3aed" font-weight="bold" font-style="normal">2  error at the output</text><text x="455" y="268" text-anchor="middle" font-size="18" fill="#1f2937" font-weight="bold" font-style="normal">ĝₜ = −(1 / Kσ) · Σ rₜ aₜ</text><text x="455" y="304" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="normal" font-style="normal">noise that helped, averaged over</text><text x="455" y="322" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="normal" font-style="normal">draws, points away from the gradient</text><rect x="610" y="200" width="270" height="150" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/><text x="745" y="228" text-anchor="middle" font-size="15" fill="#7c3aed" font-weight="bold" font-style="normal">3  weight gradient</text><text x="745" y="268" text-anchor="middle" font-size="18" fill="#1f2937" font-weight="bold" font-style="normal">Ĝ = Σₜ ĝₜ xₜᵀ</text><text x="745" y="304" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="normal" font-style="normal">same outer product as backprop —</text><text x="745" y="322" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="normal" font-style="normal">only ĝₜ comes from the population</text><line x1="300" y1="275" x2="318" y2="275" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/><line x1="590" y1="275" x2="608" y2="275" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/><path d="M715 146 V176 H165 V197" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar)"/><rect x="30" y="380" width="840" height="60" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="450" y="406" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="normal" font-style="normal">Backprop:  ĝₜ = ∂L/∂yₜ  from the chain rule.     DUST:  ĝₜ estimated from forward passes only.</text><text x="450" y="427" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="normal" font-style="normal">Embeddings: xₜ is one-hot, so Σₜ ĝₜ xₜᵀ is a scatter-add of ĝₜ into token t's row.</text></svg>