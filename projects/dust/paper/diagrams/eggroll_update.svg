<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 340" width="930" height="340" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937"><rect width="930" height="340" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="450" y="26" text-anchor="middle" font-size="18" fill="#6b7280" font-weight="bold" font-style="normal">EGGROLL on one weight matrix W  (m × n)</text><text x="150" y="62" text-anchor="middle" font-size="15" fill="#6b7280" font-weight="bold" font-style="normal">1  perturb</text><rect x="40" y="84" width="22" height="100" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/><text x="51" y="78" text-anchor="middle" font-size="13" fill="#6b7280" font-weight="bold" font-style="normal">a</text><text x="51" y="204" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="normal" font-style="normal">m</text><text x="80" y="140" text-anchor="middle" font-size="20" fill="#6b7280" font-weight="normal" font-style="normal">×</text><rect x="100" y="128" width="100" height="22" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/><text x="150" y="122" text-anchor="middle" font-size="13" fill="#6b7280" font-weight="bold" font-style="normal">bᵀ</text><text x="150" y="166" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="normal" font-style="normal">n</text><text x="212" y="140" text-anchor="middle" font-size="20" fill="#6b7280" font-weight="normal" font-style="normal">=</text><rect x="232" y="84.0" width="76" height="16" fill="#f3f4f6" stroke="#6b7280" stroke-width="0.6"/><rect x="232" y="100.6" width="76" height="16" fill="#d1d5db" stroke="#6b7280" stroke-width="0.6"/><rect x="232" y="117.2" width="76" height="16" fill="#9ca3af" stroke="#6b7280" stroke-width="0.6"/><rect x="232" y="133.8" width="76" height="16" fill="#d1d5db" stroke="#6b7280" stroke-width="0.6"/><rect x="232" y="150.4" width="76" height="16" fill="#f3f4f6" stroke="#6b7280" stroke-width="0.6"/><rect x="232" y="167.0" width="76" height="16" fill="#e5e7eb" stroke="#6b7280" stroke-width="0.6"/><text x="270" y="204" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="normal" font-style="normal">σ a bᵀ  (rank 1)</text><text x="150" y="232" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="normal" font-style="normal">m + n numbers per member,</text><text x="150" y="248" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="normal" font-style="normal">never the m × n matrix</text><text x="470" y="62" text-anchor="middle" font-size="15" fill="#6b7280" font-weight="bold" font-style="normal">2  evaluate the pair</text><rect x="350" y="84" width="240" height="46" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.2"/><text x="470" y="112" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="normal" font-style="normal">forward pass with W + σ a bᵀ   →   L⁺</text><rect x="350" y="140" width="240" height="46" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.2"/><text x="470" y="168" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="normal" font-style="normal">forward pass with W − σ a bᵀ   →   L⁻</text><rect x="380" y="200" width="180" height="40" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="470" y="225" text-anchor="middle" font-size="13" fill="#6b7280" font-weight="bold" font-style="normal">f = L⁺ − L⁻   one number</text><line x1="332" y1="140" x2="346" y2="140" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><text x="770" y="62" text-anchor="middle" font-size="15" fill="#6b7280" font-weight="bold" font-style="normal">3  combine P members</text><rect x="640" y="84" width="260" height="90" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.2"/><text x="770" y="118" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="bold" font-style="normal">ĝ = 1 / (P σ²) · Σᵢ fᵢ · σ aᵢ bᵢᵀ</text><text x="770" y="142" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="normal" font-style="normal">a sum of P rank-one matrices:</text><text x="770" y="158" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="normal" font-style="normal">its rank can reach P</text><rect x="680" y="190" width="180" height="40" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="770" y="215" text-anchor="middle" font-size="13" fill="#6b7280" font-weight="bold" font-style="normal">Adam(ĝ)  →  new W</text><line x1="600" y1="140" x2="636" y2="140" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><rect x="30" y="270" width="870" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="465" y="294" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="normal" font-style="normal">Every member scores the whole batch and returns ONE number. That number has to say which way to move all m × n entries,</text><text x="465" y="314" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="normal" font-style="normal">of every matrix at once. With P pairs, the estimate's cosine to the true gradient grows only as √(P / d).</text></svg>